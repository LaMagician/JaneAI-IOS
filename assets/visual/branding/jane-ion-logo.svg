<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">JANE ION official logo</title>
  <desc id="desc">A metallic J-shaped feminine AI profile with electric blue holographic illumination and the JANE ION wordmark.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#9eaab7"/>
      <stop offset=".52" stop-color="#eef6ff"/>
      <stop offset=".8" stop-color="#657180"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
