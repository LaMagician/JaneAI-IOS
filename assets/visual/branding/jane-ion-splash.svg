  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#0a2534"/>
      <stop offset=".4" stop-color="#07111b"/>
      <stop offset="1" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="47%" r="45%">
      <stop offset="0" stop-color="#5af6ff" stop-opacity=".72"/>
      <stop offset=".28" stop-color="#118dff" stop-opacity=".28"/>
